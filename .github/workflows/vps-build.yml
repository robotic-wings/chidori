name: VPS-compatible binary

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vps-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 24.04 x86_64 / glibc 2.39
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Verify VPS ABI target
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Build deployable binary
        run: cargo build --release --locked --bin chidori

      - name: Verify binary on the build host
        shell: bash
        run: |
          set -euo pipefail
          file target/release/chidori
          ldd target/release/chidori
          target/release/chidori --version

      - name: Package binary and provenance
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          mkdir -p dist/package
          cp target/release/chidori dist/package/chidori
          {
            echo "source_sha=$GITHUB_SHA"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "os=$PRETTY_NAME"
            echo "arch=$(uname -m)"
            echo "libc=$(getconf GNU_LIBC_VERSION)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "binary=$(target/release/chidori --version)"
            echo "binary_sha256=$(sha256sum target/release/chidori | cut -d' ' -f1)"
          } > dist/package/vps-build-metadata.txt
          archive="chidori-${GITHUB_SHA}-ubuntu-24.04-x86_64.tar.gz"
          tar -C dist/package -czf "dist/$archive" chidori vps-build-metadata.txt
          sha256sum "dist/$archive" > "dist/$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: chidori-vps-ubuntu-24.04-x86_64
          path: |
            dist/chidori-*.tar.gz
            dist/chidori-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
